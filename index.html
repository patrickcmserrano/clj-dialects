<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clojure Dialects Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020817; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
    #globe-canvas { display: block; width: 100vw; height: 100vh; }
    #ui-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui-root > * { pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="globe-canvas"></canvas>
  <div id="ui-root"></div>
  <script src="js/main.js"></script>
</body>
</html>
